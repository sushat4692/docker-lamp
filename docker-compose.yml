services:
  develop-adminer:
    container_name: develop-adminer-container
    hostname: develop-adminer-server
    image: adminer
    ports:
      - "${ADMINER_SERVER_PORT}:8080"
    networks:
      - develop-link

  develop-mysql:
    container_name: develop-db-container
    hostname: develop-db-server
    image: mariadb:10.5.10
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/config:/etc/mysql/conf.d
      - ./mysql/logs:/var/log/mysql
    ports:
      - "${MYSQL_SERVER_PORT}:3306"
    environment:
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}"
      - "MYSQL_DATABASE=${MYSQL_INITIAL_DATABASE}"
      - "MYSQL_USER=${MYSQL_INITIAL_USER}"
      - "MYSQL_PASSWORD=${MYSQL_INITIAL_PASS}"
    networks:
      - develop-link

  develop-mysql8:
    container_name: develop-mysql8-container
    hostname: develop-mysql8-server
    image: mysql:8.0
    platform: linux/amd64
    volumes:
      - mysql8_db_data:/var/lib/mysql
    ports:
      - "${MYSQL8_SERVER_PORT}:3306"
    environment:
      - "MYSQL_ROOT_PASSWORD=${MYSQL8_ROOT_PASSWORD}"
      - "MYSQL_DATABASE=${MYSQL8_INITIAL_DATABASE}"
      - "MYSQL_USER=${MYSQL8_INITIAL_USER}"
      - "MYSQL_PASSWORD=${MYSQL8_INITIAL_PASS}"
    networks:
      - develop-link

  develop-mailpit:
    image: 'axllent/mailpit:v1.31.3'
    ports:
      - '${MAILPIT_SERVER_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_SERVER_FRONT_PORT:-8025}:8025'
    networks:
      - develop-link

volumes:
  mysql8_db_data: